name: Update Cloudflare demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omnisight-demo-dispatch
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact source revision
        env:
          DEMO_SYNC_TOKEN: ${{ secrets.DEMO_SYNC_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DEMO_SYNC_TOKEN" ]]; then
            echo "::error::Add DEMO_SYNC_TOKEN scoped only to caglaryalcin/omnisight-demo with Contents: write."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DEMO_SYNC_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/caglaryalcin/omnisight-demo/dispatches \
            --data "{\"event_type\":\"sync-source\",\"client_payload\":{\"source_sha\":\"$SOURCE_SHA\"}}"
